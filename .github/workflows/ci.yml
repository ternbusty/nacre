name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Perl syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: perl -c nacre

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static jq python3

      - name: Syntax check
        run: perl -c nacre

      - name: Run integration tests
        run: |
          chmod +x test/run-tests.sh
          sudo test/run-tests.sh 2>&1 | tee /tmp/test-output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test-output.log
          retention-days: 5

  oci-validation:
    needs: integration
    uses: ./.github/workflows/oci-validation.yml

  runc-bats:
    needs: integration
    uses: ./.github/workflows/runc-compat.yml
