name: runc bats compatibility

on:
  workflow_call:
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout nacre
        uses: actions/checkout@v4

      - name: Set up Go (for runc test helpers)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libseccomp-dev jq busybox-static

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core "$HOME/bats-core"
          sudo "$HOME/bats-core/install.sh" /usr/local
          bats --version

      - name: Clone runc (latest stable)
        run: |
          RUNC_TAG="v$(git ls-remote --tags --sort=-v:refname \
            https://github.com/opencontainers/runc.git 'v[0-9]*' \
            | grep -oP 'refs/tags/v\K[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          echo ">>> Using runc $RUNC_TAG"
          git clone --depth 1 --branch "$RUNC_TAG" \
            https://github.com/opencontainers/runc "$HOME/runc"
          echo "RUNC_REPO_DIR=$HOME/runc" >> "$GITHUB_ENV"
          echo "RUNC_TAG=$RUNC_TAG" >> "$GITHUB_ENV"

      - name: Build runc test helpers
        run: |
          cd "$HOME/runc"
          make test-binaries || true
          ls -la tests/cmd/_bin/ 2>/dev/null || echo "no test binaries"

      - name: Fetch rootfs images
        run: |
          chmod +x "$HOME/runc/tests/integration/get-images.sh"
          "$HOME/runc/tests/integration/get-images.sh" > /dev/null

      - name: Prepare nacre
        run: |
          chmod +x nacre nacre-wrapper scripts/runc-compat-test.sh
          NACRE_BIN="$(pwd)/nacre-wrapper"
          echo "NACRE_BIN=$NACRE_BIN" >> "$GITHUB_ENV"

      - name: System diagnostics
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== Nacre version ==="
          perl nacre version 2>&1 || true
          echo "=== syscall() sanity check ==="
          perl -e '
            use Config;
            my $arch = $Config{archname};
            my $sys_getpid = ($arch =~ /x86_64|amd64/i) ? 39 : 172;
            my $pid = syscall($sys_getpid);
            print "arch=$arch sys_getpid=$sys_getpid result=$pid real=$$ match=" . ($pid == $$ ? "YES" : "NO") . "\n";
          '

      - name: Run runc bats integration tests
        id: bats
        run: |
          sudo env \
            NACRE_BIN="$NACRE_BIN" \
            RUNC_TAG="$RUNC_TAG" \
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            TAP_OUTPUT="$PWD/tap-output.log" \
            scripts/runc-compat-test.sh \
              --runc-dir "$RUNC_REPO_DIR" \
              --binary "$NACRE_BIN"

      - name: Show TAP output
        if: always()
        run: cat tap-output.log 2>/dev/null || echo "no output"

      - name: Upload bats TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runc-bats-tap-output
          path: tap-output.log
