name: runc bats compatibility

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      # Run the suite as an unprivileged user (like runc's tests/rootless.sh)
      # with the given host features: "", "idmap", "cgroup", "idmap+cgroup".
      rootless:
        type: boolean
        default: false
      rootless_features:
        type: string
        default: ''
      # Hide JSON::XS so nacre runs on its JSON::PP fallback.
      json_pp:
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats integration${{ inputs.rootless && format(' (rootless, {0})', inputs.rootless_features || 'no features') || '' }}${{ inputs.json_pp && ' (JSON::PP)' || '' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45

    steps:
      - name: Checkout nacre
        uses: actions/checkout@v4

      - name: Set up Go (for runc test helpers)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libseccomp-dev jq busybox-static
          # BFQ lets "per-device io weight for bfq" run instead of skipping.
          sudo modprobe bfq || echo "bfq module not available"

      - name: Hide JSON::XS (exercise the JSON::PP fallback)
        if: inputs.json_pp
        # The runner image ships JSON::XS, but most systems running nacre
        # have only the core JSON::PP. Make it unloadable without removing
        # the package (its reverse dependencies would go with it).
        run: |
          f="$(perl -MJSON::XS -e 'print $INC{"JSON/XS.pm"}')"
          sudo mv "$f" "$f.disabled"
          if perl -MJSON::XS -e 1 2>/dev/null; then
            echo "JSON::XS is still loadable" >&2
            exit 1
          fi

      - name: Set up rootless user
        if: inputs.rootless
        run: |
          # newuidmap/newgidmap for the "idmap" feature.
          sudo apt-get install -y uidmap
          sudo useradd -u 2000 -m -d /home/rootless -s /bin/bash rootless

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core "$HOME/bats-core"
          sudo "$HOME/bats-core/install.sh" /usr/local
          bats --version

      - name: Clone runc (pinned in scripts/runc-version)
        run: |
          RUNC_TAG="$(<scripts/runc-version)"
          echo ">>> Using runc $RUNC_TAG"
          # Under /tmp so that the rootless user can reach it too.
          git clone --depth 1 --branch "$RUNC_TAG" \
            https://github.com/opencontainers/runc /tmp/runc
          echo "RUNC_REPO_DIR=/tmp/runc" >> "$GITHUB_ENV"
          echo "RUNC_TAG=$RUNC_TAG" >> "$GITHUB_ENV"

      - name: Build runc test helpers
        run: |
          cd "$RUNC_REPO_DIR"
          make test-binaries || true
          ls -la tests/cmd/_bin/ 2>/dev/null || echo "no test binaries"

      - name: Fetch rootfs images
        run: |
          chmod +x "$RUNC_REPO_DIR/tests/integration/get-images.sh"
          "$RUNC_REPO_DIR/tests/integration/get-images.sh" > /dev/null

      - name: Prepare nacre
        run: |
          chmod +x nacre nacre-wrapper scripts/runc-compat-test.sh
          NACRE_BIN="$(pwd)/nacre-wrapper"
          echo "NACRE_BIN=$NACRE_BIN" >> "$GITHUB_ENV"

      - name: Load AppArmor profile for nacre
        # Ubuntu 24.04 restricts unprivileged user namespace creation via
        # AppArmor. Adapt the system runc profile (which grants the
        # "userns" rule) for nacre, matching runc's own CI approach.
        # Ref: https://discourse.ubuntu.com/t/39890#unprivileged-user-namespace-restrictions-15
        run: |
          sed "s;^profile runc /usr/sbin/runc;profile nacre /usr/bin/perl;" \
            < /etc/apparmor.d/runc | sudo apparmor_parser

      - name: System diagnostics
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== Nacre version ==="
          perl nacre version 2>&1 || true
          echo "=== JSON backend ==="
          perl -e 'print eval { require JSON::XS; 1 } ? "JSON::XS\n" : "JSON::PP (JSON::XS not installed)\n"'
          echo "=== syscall() sanity check ==="
          perl -e '
            use Config;
            my $arch = $Config{archname};
            my $sys_getpid = ($arch =~ /x86_64|amd64/i) ? 39 : 172;
            my $pid = syscall($sys_getpid);
            print "arch=$arch sys_getpid=$sys_getpid result=$pid real=$$ match=" . ($pid == $$ ? "YES" : "NO") . "\n";
          '

      - name: Run runc bats integration tests
        id: bats
        env:
          ROOTLESS: ${{ inputs.rootless }}
          ROOTLESS_FEATURES: ${{ inputs.rootless_features }}
        run: |
          rootless_args=()
          if [ "$ROOTLESS" = true ]; then
            rootless_args=(--rootless-user rootless --rootless-features "$ROOTLESS_FEATURES")
          fi
          sudo aa-exec -p nacre -- env \
            NACRE_BIN="$NACRE_BIN" \
            RUNC_TAG="$RUNC_TAG" \
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            TAP_OUTPUT="$PWD/tap-output.log" \
            scripts/runc-compat-test.sh \
              --runc-dir "$RUNC_REPO_DIR" \
              --binary "$NACRE_BIN" \
              "${rootless_args[@]}"

      - name: Show TAP output
        if: always()
        run: cat tap-output.log 2>/dev/null || echo "no output"

      - name: Upload bats TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runc-bats-tap-output-${{ inputs.runner || 'ubuntu-24.04' }}${{ inputs.rootless && format('-rootless-{0}', inputs.rootless_features || 'none') || '' }}${{ inputs.json_pp && '-json-pp' || '' }}
          path: tap-output.log
