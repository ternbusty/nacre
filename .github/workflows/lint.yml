name: Lint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Perl lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache CPAN modules
        uses: actions/cache@v4
        with:
          path: ~/perl5
          key: cpan-${{ runner.os }}-perl-tidy-critic
          restore-keys: cpan-${{ runner.os }}-

      - name: Install Perl::Tidy and Perl::Critic
        run: |
          cpan -T Perl::Tidy Perl::Critic
        env:
          PERL_MM_USE_DEFAULT: 1

      - name: Run perlcritic
        run: |
          export PATH="$HOME/perl5/bin:$PATH" PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
          perlcritic --profile .perlcriticrc nacre lib/Nacre/*.pm

      - name: Check perltidy formatting
        run: |
          export PATH="$HOME/perl5/bin:$PATH" PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
          perltidy --profile=.perltidyrc -b nacre lib/Nacre/*.pm
          if git diff --name-only | grep -q .; then
            echo "::error::Files need formatting. Run 'perltidy --profile=.perltidyrc -b nacre lib/Nacre/*.pm' locally."
            git diff --stat
            git diff
            exit 1
          fi
