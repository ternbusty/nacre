name: OCI runtime-tools validation

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
  workflow_dispatch:

jobs:
  validate:
    name: runtime-tools validation
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install nacre
        run: |
          sudo mkdir -p /opt/nacre
          sudo cp nacre /opt/nacre/nacre
          sudo cp -r lib /opt/nacre/lib
          sudo chmod +x /opt/nacre/nacre
          # Create a wrapper that invokes perl
          sudo tee /opt/nacre/bin > /dev/null <<'WRAPPER'
          #!/bin/bash
          exec perl /opt/nacre/nacre "$@"
          WRAPPER
          sudo chmod +x /opt/nacre/bin

      - name: Install Go and dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y golang-go make busybox-static linux-libc-dev

      - name: Clone and build runtime-tools validation suite
        run: |
          cd $HOME
          git clone --depth 1 https://github.com/opencontainers/runtime-tools
          cd runtime-tools
          make runtimetest validation-executables

      - name: Build busybox rootfs tarball
        run: |
          set -eux
          BUSYBOX=$(which busybox)
          STAGE=$(mktemp -d)
          mkdir -p $STAGE/{bin,etc,proc,sys,dev,tmp}
          cp "$BUSYBOX" $STAGE/bin/
          ( cd $STAGE/bin && for c in sh ls cat echo grep awk sleep true false test mkdir rm chmod chown touch stat date wc head tail sort uniq id ps mount umount; do ln -sf busybox $c; done )
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) GOARCH=arm64 ;;
            x86_64|amd64)  GOARCH=amd64 ;;
            *)             GOARCH=$ARCH ;;
          esac
          tar -czf $HOME/runtime-tools/rootfs-$GOARCH.tar.gz -C $STAGE .

      - name: Run validation suite
        id: run-validation
        run: |
          # ---------------------------------------------------------------
          # Close ALL fds > 2 in this step shell.  The Actions runner
          # leaks its log-pipe on high fds; children that inherit it
          # block subsequent steps (and job cleanup) indefinitely.
          # ---------------------------------------------------------------
          for _fd in /proc/self/fd/*; do
            _n=$(basename "$_fd")
            if [ "$_n" -gt 2 ] 2>/dev/null; then
              eval "exec ${_n}>&-" 2>/dev/null || true
            fi
          done

          OUTDIR=$HOME/validation-out
          mkdir -p "$OUTDIR"

          cat > /tmp/run-validation.sh << 'VALIDATION_SCRIPT'
          #!/usr/bin/env bash
          set +e

          cd "$HOME/runtime-tools"
          RUNTIME=/opt/nacre/bin
          OUTDIR=$HOME/validation-out

          PASS=0; FAIL=0; ERROR=0; TIMEOUT=0

          SKIP_V1='^(linux_cgroups_(network|blkio|hugetlb|devices|pids|relative_(blkio|network|hugetlb|devices|pids))|linux_cgroups_relative_cpus|linux_cgroups_relative_memory|linux_cgroups_cpus|linux_cgroups_memory|delete_(only_create_)?resources)$'
          # hooks, prestart, poststart and poststart_fail report the same
          # errors with runc 1.3.4: hooks expects "post-start1" where its hook
          # writes "post-start1 called", and prestart expects prestart hooks
          # after start, which runtime-spec now runs during create.
          SKIP_BROKEN='^(pidfile|process_rlimits|linux_ns_itype|process_capabilities_fail|linux_uid_mappings|hooks|prestart|poststart|poststart_fail)$'
          # Lifecycle tests that print no ok/not ok lines and report only a
          # failure, as an "error" diagnostic or a nonzero exit.
          NO_ASSERTIONS='^(poststop|poststop_fail|prestart_fail|process_rlimits_fail)$'
          # linux_seccomp blocks getcwd, so runtimetest stops after its first
          # check by design.
          RT_PARTIAL='^linux_seccomp$'
          SKIP_V1_N=0; SKIP_BROKEN_N=0

          for t in validation/*/*.t; do
            name="${t##*/}"
            name="${name%.t}"

            if [[ "$name" =~ $SKIP_V1 ]]; then
              SKIP_V1_N=$((SKIP_V1_N+1))
              echo "SKIP(v1) $name"
              continue
            fi
            if [[ "$name" =~ $SKIP_BROKEN ]]; then
              SKIP_BROKEN_N=$((SKIP_BROKEN_N+1))
              echo "SKIP(broken-upstream) $name"
              continue
            fi

            # Each test runs in its own ephemeral mount namespace so
            # that (a) /proc is remounted to match the PID namespace
            # and (b) mount corruption from nacre's pivot_root cannot
            # accumulate across tests.  --propagation private prevents
            # mount events leaking back to the parent namespace.
            out=$OUTDIR/$name.log
            unshare --mount --propagation private bash -c '
              mount -t proc proc /proc 2>/dev/null
              timeout --signal=KILL 60 env RUNTIME="$1" "$2"
              rc=$?
              "$1" delete --force "$3" >/dev/null 2>&1
              killall -9 perl nacre runtimetest 2>/dev/null
              exit $rc
            ' -- "$RUNTIME" "$t" "$name" > "$out" 2>&1
            rc=$?

            # Brief pause + clean up state directory between tests
            read -t 0.2 </dev/null 2>/dev/null || true
            find /run/nacre -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              TIMEOUT=$((TIMEOUT+1))
              echo "TIMEOUT  $name"
              continue
            fi

            # runtimetest's own TAP is how a test that runs it inside the
            # container reports: printed as is, or embedded as the "stdout"
            # of a diagnostic when the test passes its TAP along.
            src="${t%.t}.go"
            inside=0; tap_is_nil=0
            while IFS= read -r line; do
              case "$line" in
                *"RuntimeInsideValidate(g, nil"*) inside=1; tap_is_nil=1 ;;
                *"RuntimeInsideValidate("*)       inside=1 ;;
              esac
            done < "$src"

            n_ok=0; n_notok=0; n_error=0; rt_header=0; rt_embedded=0; rt_empty=0
            rt_plan=0; rt_embedded_planned=0
            if [ -f "$out" ]; then
              while IFS= read -r line; do
                case "$line" in
                  "not ok "*)  n_notok=$((n_notok+1)) ;;
                  "ok "*)      n_ok=$((n_ok+1)) ;;
                  "TAP version 13") rt_header=$((rt_header+1)) ;;
                esac
                [[ "$line" =~ ^1\.\.([0-9]+)$ ]] && rt_plan=${BASH_REMATCH[1]}
                case "$line" in
                  '    "error": '*)                 n_error=$((n_error+1)) ;;
                  *'"stdout": "TAP version 13'*'\n1..'[0-9]*)
                    rt_embedded=$((rt_embedded+1)); rt_embedded_planned=$((rt_embedded_planned+1)) ;;
                  *'"stdout": "TAP version 13'*)  rt_embedded=$((rt_embedded+1)) ;;
                  *'"stdout": ""'*)               rt_empty=$((rt_empty+1)) ;;
                esac
              done < "$out"
            fi

            # A test that runs runtimetest but got none of its output has
            # checked nothing inside the container, and one whose runtimetest
            # TAP has no plan line (1..N) stopped part way.
            rt_missing=0; rt_partial=0
            if [ "$inside" -eq 1 ] && ! [[ "$name" =~ $NO_ASSERTIONS ]]; then
              if [ "$tap_is_nil" -eq 1 ]; then
                [ "$rt_header" -gt 0 ] || rt_missing=1
                [ "$rt_missing" -eq 0 ] && [ "$((n_ok + n_notok))" -ne "$rt_plan" ] && rt_partial=1
              else
                { [ "$rt_embedded" -gt 0 ] && [ "$rt_empty" -eq 0 ]; } || rt_missing=1
                [ "$rt_missing" -eq 0 ] && [ "$rt_embedded_planned" -ne "$rt_embedded" ] && rt_partial=1
              fi
              [[ "$name" =~ $RT_PARTIAL ]] && rt_partial=0
            fi

            if [ "$n_notok" -gt 0 ]; then
              FAIL=$((FAIL+1))
              echo "FAIL     $name  ok=$n_ok notok=$n_notok"
            elif [ "$rt_missing" -eq 1 ]; then
              FAIL=$((FAIL+1))
              echo "FAIL     $name  ok=$n_ok (no runtimetest output)"
            elif [ "$rt_partial" -eq 1 ]; then
              FAIL=$((FAIL+1))
              echo "FAIL     $name  ok=$n_ok (runtimetest output incomplete)"
            elif [ "$n_ok" -gt 0 ]; then
              PASS=$((PASS+1))
              echo "PASS     $name  ok=$n_ok"
            elif [ "$rc" -ne 0 ]; then
              ERROR=$((ERROR+1))
              echo "ERROR    $name  rc=$rc"
            elif [ "$n_error" -gt 0 ]; then
              FAIL=$((FAIL+1))
              echo "FAIL     $name  (error diagnostic)"
            elif [[ "$name" =~ $NO_ASSERTIONS ]]; then
              PASS=$((PASS+1))
              echo "PASS     $name  (no assertions; no error)"
            else
              FAIL=$((FAIL+1))
              echo "FAIL     $name  (no results)"
            fi
          done

          echo "=== SUMMARY ==="
          echo "PASS=$PASS  FAIL=$FAIL  TIMEOUT=$TIMEOUT  ERROR=$ERROR  SKIP_V1=$SKIP_V1_N  SKIP_BROKEN=$SKIP_BROKEN_N"
          VALIDATION_SCRIPT
          chmod +x /tmp/run-validation.sh

          # Run inside a PID namespace.  The PID namespace guarantees
          # the kernel kills every orphan when init exits, preventing
          # the Post Run hang.  Each test gets its own ephemeral mount
          # namespace (with /proc remounted) inside the script, so
          # nacre sees correct namespace-local PIDs and mount corruption
          # from pivot_root is isolated per-test.
          sudo -E unshare --pid --fork \
            bash /tmp/run-validation.sh \
            > /tmp/validation-main.log 2>&1 </dev/null

          # Display results (set +e so grep failures don't kill the step)
          set +eo pipefail
          echo "::group::Validation output"
          cat /tmp/validation-main.log
          echo "::endgroup::"

          # Show failing test logs
          echo "::group::Failing test details"
          grep -E "^FAIL " /tmp/validation-main.log 2>/dev/null | awk '{print $2}' | while IFS= read -r tname; do
            f="$OUTDIR/$tname.log"
            if [ -f "$f" ]; then
              echo "=== $(basename "$f") ==="
              head -100 "$f"
              lines=$(wc -l < "$f")
              [ "$lines" -gt 100 ] && echo "... ($lines lines total, truncated)"
              echo ""
            fi
          done
          echo "::endgroup::"

          # Show errored/timed-out test logs
          echo "::group::Error and timeout details"
          grep -E "^(ERROR|TIMEOUT)" /tmp/validation-main.log 2>/dev/null | while IFS= read -r line; do
            tname=$(echo "$line" | awk '{print $2}')
            f="$OUTDIR/$tname.log"
            if [ -f "$f" ]; then
              echo "=== $tname ==="
              head -50 "$f"
              echo ""
            fi
          done
          echo "::endgroup::"

          # Parse counts from the SUMMARY line in the log (more
          # reliable than /tmp files which may not survive the mount
          # namespace).
          _summary=$(grep '^PASS=' /tmp/validation-main.log 2>/dev/null | tail -1)
          PASS=0; FAIL=0; TIMEOUT=0; ERROR=0; SKIP_V1=0; SKIP_BROKEN=0
          if [ -n "$_summary" ]; then
            eval "$(echo "$_summary" | sed 's/  */ /g; s/ /; /g; s/SKIP_V1_N/SKIP_V1/; s/SKIP_BROKEN_N/SKIP_BROKEN/')"
          fi

          # Step summary
          {
            echo "## OCI runtime-tools validation"
            echo
            echo "| metric | count |"
            echo "|---|---|"
            echo "| pass | $PASS |"
            echo "| fail | $FAIL |"
            echo "| timeout | $TIMEOUT |"
            echo "| error | $ERROR |"
            echo "| skip (cgroup v1) | $SKIP_V1 |"
            echo "| skip (broken upstream) | $SKIP_BROKEN |"
            echo
            if [ "$FAIL" -gt 0 ]; then
              echo "### Failing tests"
              grep "^FAIL " /tmp/validation-main.log 2>/dev/null | while IFS= read -r line; do
                echo "- $line"
              done
            fi
            if [ "$TIMEOUT" -gt 0 ]; then
              echo "### Timeouts"
              grep "^TIMEOUT " /tmp/validation-main.log 2>/dev/null | while IFS= read -r line; do
                echo "- $line"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "validation_pass=$PASS"       >> "$GITHUB_OUTPUT"
          echo "validation_fail=$FAIL"       >> "$GITHUB_OUTPUT"
          echo "validation_timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "validation_error=$ERROR"     >> "$GITHUB_OUTPUT"

          # Final exit code: fail if any tests failed or errored
          if [ "$FAIL" -gt 0 ] || [ "$ERROR" -gt 0 ]; then
            echo "::error::OCI validation: $FAIL failures, $ERROR errors"
            exit 1
          fi
