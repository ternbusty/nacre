name: OCI runtime-tools validation

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    name: runtime-tools validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install nacre
        run: |
          sudo mkdir -p /opt/nacre
          sudo cp nacre /opt/nacre/nacre
          sudo chmod +x /opt/nacre/nacre
          # Create a wrapper that invokes perl
          sudo tee /opt/nacre/bin > /dev/null <<'WRAPPER'
          #!/bin/bash
          exec perl /opt/nacre/nacre "$@"
          WRAPPER
          sudo chmod +x /opt/nacre/bin

      - name: System diagnostics
        run: |
          echo "=== Architecture ==="
          uname -m
          uname -a
          echo "=== Perl ==="
          perl -v | head -5
          perl -e 'use Config; print "archname=$Config{archname}\n"'
          echo "=== Nacre version ==="
          perl /opt/nacre/nacre version 2>&1 || true
          echo "=== syscall() sanity check ==="
          perl -e '
            use Config;
            my $arch = $Config{archname};
            my $sys_getpid = ($arch =~ /x86_64|amd64/i) ? 39 : 172;
            my $pid = syscall($sys_getpid);
            print "arch=$arch\n";
            print "sys_getpid=$sys_getpid result=$pid real=$$\n";
            print "match=" . ($pid == $$ ? "YES" : "NO") . "\n";
          '

      - name: Install Go and dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y golang-go make busybox-static linux-libc-dev

      - name: Clone and build runtime-tools validation suite
        run: |
          cd $HOME
          git clone --depth 1 https://github.com/opencontainers/runtime-tools
          cd runtime-tools
          make runtimetest validation-executables

      - name: Build busybox rootfs tarball
        run: |
          set -eux
          BUSYBOX=$(which busybox)
          STAGE=$(mktemp -d)
          mkdir -p $STAGE/{bin,etc,proc,sys,dev,tmp}
          cp "$BUSYBOX" $STAGE/bin/
          ( cd $STAGE/bin && for c in sh ls cat echo grep awk sleep true false test mkdir rm chmod chown touch stat date wc head tail sort uniq id ps mount umount; do ln -sf busybox $c; done )
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) GOARCH=arm64 ;;
            x86_64|amd64)  GOARCH=amd64 ;;
            *)             GOARCH=$ARCH ;;
          esac
          tar -czf $HOME/runtime-tools/rootfs-$GOARCH.tar.gz -C $STAGE .

      - name: Run validation suite
        id: run-validation
        run: |
          # ---------------------------------------------------------------
          # CRITICAL: Close ALL fds > 2 in THIS step shell immediately.
          #
          # The Actions runner leaks its log-pipe on high fds.  If any child
          # process inherits one of those fds, the runner never sees EOF and
          # this step (plus every subsequent one) hangs until the job times
          # out.  Closing them here means sudo / setsid / bash / test-procs
          # can never inherit the pipe on fd 3+.
          # ---------------------------------------------------------------
          for _fd in /proc/self/fd/*; do
            _n=$(basename "$_fd")
            if [ "$_n" -gt 2 ] 2>/dev/null; then
              eval "exec ${_n}>&-" 2>/dev/null || true
            fi
          done

          OUTDIR=$HOME/validation-out
          mkdir -p "$OUTDIR"

          cat > /tmp/run-validation.sh << 'VALIDATION_SCRIPT'
          #!/usr/bin/env bash
          set +e

          cd "$HOME/runtime-tools"
          RUNTIME=/opt/nacre/bin
          OUTDIR=$HOME/validation-out

          PASS=0; FAIL=0; ERROR=0; TIMEOUT=0; SKIP_V1=0; SKIP_BROKEN=0
          SKIP_V1_PATTERN='^(linux_cgroups_(network|blkio|hugetlb|devices|pids|relative_(blkio|network|hugetlb|devices|pids))|linux_cgroups_relative_cpus|linux_cgroups_relative_memory|linux_cgroups_cpus|linux_cgroups_memory|delete_(only_create_)?resources)$'
          SKIP_BROKEN_PATTERN='^(pidfile|process_rlimits)$'

          for t in validation/*/*.t; do
            name=$(basename "$t" .t)

            if echo "$name" | grep -qE "$SKIP_V1_PATTERN"; then
              SKIP_V1=$((SKIP_V1+1))
              echo "SKIP(v1) $name"
              continue
            fi
            if echo "$name" | grep -qE "$SKIP_BROKEN_PATTERN"; then
              SKIP_BROKEN=$((SKIP_BROKEN+1))
              echo "SKIP(broken-upstream) $name"
              continue
            fi

            out=$OUTDIR/$name.log
            timeout --signal=KILL 60 env RUNTIME=$RUNTIME "$t" > "$out" 2>&1
            rc=$?

            # Aggressively clean up between tests
            $RUNTIME delete --force "$name" > /dev/null 2>&1 || true
            killall -9 perl nacre runtimetest 2>/dev/null || true
            sleep 0.2
            find /run/nacre -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              TIMEOUT=$((TIMEOUT+1))
              echo "TIMEOUT  $name"
              continue
            fi

            n_ok=$(grep -c "^ok " "$out" 2>/dev/null || true)
            n_notok=$(grep -c "^not ok " "$out" 2>/dev/null || true)
            n_ok=${n_ok:-0}; n_notok=${n_notok:-0}

            if [ "$n_notok" -gt 0 ]; then
              FAIL=$((FAIL+1))
              echo "FAIL     $name  ok=$n_ok notok=$n_notok"
            elif [ "$n_ok" -gt 0 ]; then
              PASS=$((PASS+1))
              echo "PASS     $name  ok=$n_ok"
            elif [ "$rc" -ne 0 ]; then
              ERROR=$((ERROR+1))
              echo "ERROR    $name  rc=$rc"
            else
              echo "SKIP     $name"
            fi
          done

          echo "=== SUMMARY ==="
          echo "PASS=$PASS  FAIL=$FAIL  TIMEOUT=$TIMEOUT  ERROR=$ERROR  SKIP_V1=$SKIP_V1  SKIP_BROKEN=$SKIP_BROKEN"

          # Write outputs for the GitHub step
          echo "$PASS"    > /tmp/validation_pass
          echo "$FAIL"    > /tmp/validation_fail
          echo "$TIMEOUT" > /tmp/validation_timeout
          echo "$ERROR"   > /tmp/validation_error
          VALIDATION_SCRIPT
          chmod +x /tmp/run-validation.sh

          # Run as root, in a new session, ALL stdio to a log file.
          # The test loop has zero access to Actions fds.
          sudo -E setsid bash /tmp/run-validation.sh \
            > /tmp/validation-main.log 2>&1 </dev/null

          # Kill ALL lingering processes from the validation run
          sudo pkill -9 -f 'nacre|runtimetest|validation\.t' 2>/dev/null || true
          sleep 1

          # Display results (set +e so grep failures don't kill the step)
          set +eo pipefail
          echo "::group::Validation output"
          cat /tmp/validation-main.log
          echo "::endgroup::"

          # Show failing test logs
          echo "::group::Failing test details"
          for f in "$OUTDIR"/*.log; do
            [ -f "$f" ] || continue
            n_notok=$(grep -c "^not ok " "$f" 2>/dev/null || true)
            if [ "${n_notok:-0}" -gt 0 ]; then
              echo "=== $(basename "$f") ==="
              head -100 "$f"
              lines=$(wc -l < "$f")
              [ "$lines" -gt 100 ] && echo "... ($lines lines total, truncated)"
              echo ""
            fi
          done
          echo "::endgroup::"

          # Show errored/timed-out test logs
          echo "::group::Error and timeout details"
          grep -E "^(ERROR|TIMEOUT)" /tmp/validation-main.log | while IFS= read -r line; do
            tname=$(echo "$line" | awk '{print $2}')
            f="$OUTDIR/$tname.log"
            if [ -f "$f" ]; then
              echo "=== $tname ==="
              head -50 "$f"
              echo ""
            fi
          done
          echo "::endgroup::"

          # Read outputs
          PASS=$(cat /tmp/validation_pass 2>/dev/null || echo 0)
          FAIL=$(cat /tmp/validation_fail 2>/dev/null || echo 0)
          TIMEOUT=$(cat /tmp/validation_timeout 2>/dev/null || echo 0)
          ERROR=$(cat /tmp/validation_error 2>/dev/null || echo 0)
          SKIP_V1=$(grep -c "^SKIP(v1)" /tmp/validation-main.log 2>/dev/null || echo 0)
          SKIP_BROKEN=$(grep -c "^SKIP(broken-upstream)" /tmp/validation-main.log 2>/dev/null || echo 0)

          # Step summary
          {
            echo "## OCI runtime-tools validation"
            echo
            echo "| metric | count |"
            echo "|---|---|"
            echo "| pass | $PASS |"
            echo "| fail | $FAIL |"
            echo "| timeout | $TIMEOUT |"
            echo "| error | $ERROR |"
            echo "| skip (cgroup v1) | $SKIP_V1 |"
            echo "| skip (broken upstream) | $SKIP_BROKEN |"
            echo
            if [ "$FAIL" -gt 0 ]; then
              echo "### Failing tests"
              grep "^FAIL " /tmp/validation-main.log | while IFS= read -r line; do
                echo "- $line"
              done
            fi
            if [ "$TIMEOUT" -gt 0 ]; then
              echo "### Timeouts"
              grep "^TIMEOUT " /tmp/validation-main.log | while IFS= read -r line; do
                echo "- $line"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "validation_pass=$PASS"       >> "$GITHUB_OUTPUT"
          echo "validation_fail=$FAIL"       >> "$GITHUB_OUTPUT"
          echo "validation_timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "validation_error=$ERROR"     >> "$GITHUB_OUTPUT"

          # Final cleanup — kill anything still alive
          sudo pkill -9 -f 'nacre|runtimetest' 2>/dev/null || true

      - name: Fail on validation failures
        if: steps.run-validation.outputs.validation_fail != '0' || steps.run-validation.outputs.validation_error != '0'
        run: |
          echo "::error::OCI validation failed: ${{ steps.run-validation.outputs.validation_fail }} failures, ${{ steps.run-validation.outputs.validation_error }} errors"
          exit 1

      - name: Upload per-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: ~/validation-out/
