name: OCI runtime-tools validation

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    name: runtime-tools validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install nacre
        run: |
          sudo mkdir -p /opt/nacre
          sudo cp nacre /opt/nacre/nacre
          sudo chmod +x /opt/nacre/nacre
          # Create a wrapper that invokes perl
          sudo tee /opt/nacre/bin > /dev/null <<'WRAPPER'
          #!/bin/bash
          exec perl /opt/nacre/nacre "$@"
          WRAPPER
          sudo chmod +x /opt/nacre/bin

      - name: System diagnostics
        run: |
          echo "=== Architecture ==="
          uname -m
          uname -a
          echo "=== Perl ==="
          perl -v | head -5
          perl -e 'use Config; print "archname=$Config{archname}\n"'
          echo "=== Nacre version ==="
          perl /opt/nacre/nacre version 2>&1 || true
          echo "=== syscall() sanity check ==="
          perl -e '
            use Config;
            my $arch = $Config{archname};
            my $sys_getpid = ($arch =~ /x86_64|amd64/i) ? 39 : 172;
            my $pid = syscall($sys_getpid);
            print "arch=$arch\n";
            print "sys_getpid=$sys_getpid result=$pid real=$$\n";
            print "match=" . ($pid == $$ ? "YES" : "NO") . "\n";
          '
          echo "=== unshare test (system command) ==="
          sudo unshare --mount echo "unshare-cmd: OK" 2>&1 || echo "unshare-cmd: FAILED rc=$?"
          echo "=== unshare test (each namespace flag individually, as root) ==="
          sudo perl -e '
            my %flags = (
              CLONE_NEWNS  => 0x00020000,
              CLONE_NEWUTS => 0x04000000,
              CLONE_NEWIPC => 0x08000000,
              CLONE_NEWNET => 0x40000000,
            );
            for my $name (sort keys %flags) {
              my $pid = fork();
              if ($pid == 0) {
                my $ret = syscall(272, $flags{$name});
                if ($ret == 0) {
                  print "child unshare($name): OK\n";
                } else {
                  print "child unshare($name): FAILED errno=" . int($!) . " ($!)\n";
                }
                exit(0);
              }
              waitpid($pid, 0);
            }
          '
          echo "=== unshare test (combined 0x4c020000, as root, after fork) ==="
          sudo perl -e '
            my $pid = fork();
            if ($pid == 0) {
                my $ret = syscall(272, 0x4c020000);
                if ($ret == 0) {
                    print "child unshare(0x4c020000): OK\n";
                } else {
                    print "child unshare(0x4c020000): FAILED errno=" . int($!) . " ($!)\n";
                }
                exit(0);
            }
            waitpid($pid, 0);
          '

      - name: Install Go and dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y golang-go make busybox-static

      - name: Clone and build runtime-tools validation suite
        run: |
          cd $HOME
          git clone --depth 1 https://github.com/opencontainers/runtime-tools
          cd runtime-tools
          make runtimetest validation-executables

      - name: Build busybox rootfs tarball
        run: |
          set -eux
          BUSYBOX=$(which busybox)
          STAGE=$(mktemp -d)
          mkdir -p $STAGE/{bin,etc,proc,sys,dev,tmp}
          cp "$BUSYBOX" $STAGE/bin/
          ( cd $STAGE/bin && for c in sh ls cat echo grep awk sleep true false test mkdir rm chmod chown touch stat date wc head tail sort uniq id ps mount umount; do ln -sf busybox $c; done )
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) GOARCH=arm64 ;;
            x86_64|amd64)  GOARCH=amd64 ;;
            *)             GOARCH=$ARCH ;;
          esac
          tar -czf $HOME/runtime-tools/rootfs-$GOARCH.tar.gz -C $STAGE .

      - name: Run validation suite
        id: run-validation
        run: |
          set +e
          cd $HOME/runtime-tools
          RUNTIME=/opt/nacre/bin
          mkdir -p $HOME/validation-out
          PASS=0; FAIL=0; ERROR=0; TIMEOUT=0; SKIP_V1=0; SKIP_BROKEN=0
          declare -a FAIL_NAMES TIMEOUT_NAMES SKIP_V1_NAMES SKIP_BROKEN_NAMES
          # Cgroup v1 tests skipped on cgroup-v2 only hosts
          SKIP_V1_PATTERN='^(linux_cgroups_(network|blkio|hugetlb|devices|pids|relative_(blkio|network|hugetlb|devices|pids))|linux_cgroups_relative_cpus|linux_cgroups_relative_memory|linux_cgroups_cpus|linux_cgroups_memory|delete_(only_create_)?resources)$'
          # Known-broken upstream tests
          SKIP_BROKEN_PATTERN='^(pidfile|process_rlimits)$'
          for t in validation/*/*.t; do
            name=$(basename "$t" .t)
            if echo "$name" | grep -qE "$SKIP_V1_PATTERN"; then
              SKIP_V1=$((SKIP_V1+1))
              SKIP_V1_NAMES+=("$name")
              echo "SKIP(v1) $name"
              continue
            fi
            if echo "$name" | grep -qE "$SKIP_BROKEN_PATTERN"; then
              SKIP_BROKEN=$((SKIP_BROKEN+1))
              SKIP_BROKEN_NAMES+=("$name")
              echo "SKIP(broken-upstream) $name"
              continue
            fi
            out=$HOME/validation-out/$name.log
            # Run in its own session (setsid) so lingering children don't
            # inherit the GitHub Actions log pipe and block subsequent steps.
            sudo timeout --signal=KILL 60 setsid env RUNTIME=$RUNTIME "$t" > "$out" 2>&1
            rc=$?
            sudo $RUNTIME delete --force "$name" 2>/dev/null || true
            # Kill any lingering nacre/perl processes from this test
            sudo killall -9 perl nacre runtimetest 2>/dev/null || true
            sleep 0.2
            # Safe cleanup: only remove nacre state files
            sudo find /run/nacre -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
            if [ "$rc" -eq 124 ]; then
              TIMEOUT=$((TIMEOUT+1))
              TIMEOUT_NAMES+=("$name")
              echo "TIMEOUT  $name"
              continue
            fi
            n_ok=$(grep -c "^ok " "$out" 2>/dev/null)
            n_notok=$(grep -c "^not ok " "$out" 2>/dev/null)
            n_ok=${n_ok:-0}; n_notok=${n_notok:-0}
            if [ "$n_notok" -gt 0 ]; then
              FAIL=$((FAIL+1))
              FAIL_NAMES+=("$name (ok=$n_ok notok=$n_notok)")
              echo "FAIL     $name  ok=$n_ok notok=$n_notok"
            elif [ "$n_ok" -gt 0 ]; then
              PASS=$((PASS+1))
              echo "PASS     $name  ok=$n_ok"
            elif [ "$rc" -ne 0 ]; then
              ERROR=$((ERROR+1))
              echo "ERROR    $name  rc=$rc"
            else
              echo "SKIP     $name"
            fi
          done
          echo "=== SUMMARY ==="
          echo "PASS=$PASS  FAIL=$FAIL  TIMEOUT=$TIMEOUT  ERROR=$ERROR  SKIP_V1=$SKIP_V1  SKIP_BROKEN=$SKIP_BROKEN"
          {
            echo "## OCI runtime-tools validation"
            echo
            echo "| metric | count |"
            echo "|---|---|"
            echo "| pass | $PASS |"
            echo "| fail | $FAIL |"
            echo "| timeout | $TIMEOUT |"
            echo "| error | $ERROR |"
            echo "| skip (cgroup v1) | $SKIP_V1 |"
            echo "| skip (broken upstream) | $SKIP_BROKEN |"
            echo
            if [ ${#FAIL_NAMES[@]} -gt 0 ]; then
              echo "### Failing tests"
              for n in "${FAIL_NAMES[@]}"; do
                echo "- $n"
              done
            fi
            if [ ${#TIMEOUT_NAMES[@]} -gt 0 ]; then
              echo "### Timeouts"
              for n in "${TIMEOUT_NAMES[@]}"; do
                echo "- $n"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "validation_pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "validation_fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "validation_timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "validation_error=$ERROR" >> "$GITHUB_OUTPUT"

      - name: Kill lingering processes
        if: always()
        timeout-minutes: 1
        run: |
          # Kill ALL children of this runner to avoid inherited-fd hangs
          sudo killall -9 perl nacre runtimetest sleep sh 2>/dev/null || true
          sleep 0.5

      - name: Show test logs
        if: always()
        timeout-minutes: 1
        run: |
          for f in ~/validation-out/*.log; do
            [ -f "$f" ] || continue
            n_ok=$(grep -c "^ok " "$f" 2>/dev/null || echo 0)
            n_notok=$(grep -c "^not ok " "$f" 2>/dev/null || echo 0)
            if [ "$n_notok" -gt 0 ] || { [ "$n_ok" -eq 0 ] && [ -s "$f" ]; }; then
              echo "=== $(basename "$f") ==="
              head -100 "$f"
              lines=$(wc -l < "$f")
              [ "$lines" -gt 100 ] && echo "... ($lines lines total, truncated)"
              echo ""
            fi
          done

      - name: Fail on validation failures
        if: steps.run-validation.outputs.validation_fail != '0' || steps.run-validation.outputs.validation_error != '0'
        run: |
          echo "::error::OCI validation failed: ${{ steps.run-validation.outputs.validation_fail }} failures, ${{ steps.run-validation.outputs.validation_error }} errors"
          exit 1

      - name: Upload per-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: ~/validation-out/
